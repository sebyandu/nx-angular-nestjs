<mat-toolbar class="topbar">
  <span>WebUI</span>
</mat-toolbar>

<mat-sidenav-container class="layout">
  <mat-sidenav mode="side" opened>
    <mat-nav-list>
      <a mat-list-item routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Dashboard</a>
      <a mat-list-item href="#">Users</a>
      <a mat-list-item routerLink="/summary" routerLinkActive="active">Summary</a>
      <a mat-list-item routerLink="/history" routerLinkActive="active">History</a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <div class="content">
    <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
